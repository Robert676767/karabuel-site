# Подключить в http { } (лимиты) и server { } (остальное)
limit_req_zone  $binary_remote_addr zone=req:10m  rate=10r/s;   # 10 запросов/сек с одного IP
limit_conn_zone $binary_remote_addr zone=conn:10m;
limit_req_status 429;

server {
    listen 443 ssl http2;
    server_name example.ru;                       # ваш домен
    root /var/www/site;
    ssl_protocols TLSv1.2 TLSv1.3;

    # --- анти-DDoS на уровне сервера ---
    limit_req  zone=req burst=30 nodelay;
    limit_conn conn 20;
    client_body_timeout 10s;  client_header_timeout 10s;   # защита от slowloris
    send_timeout 15s;  keepalive_timeout 15s;
    client_max_body_size 16k;                     # сайт статический, большие тела не нужны
    server_tokens off;

    # --- заголовки безопасности ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src https://yandex.ru https://yandex.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # только GET/HEAD, скрытые файлы закрыты
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location ~ /\. { deny all; }
    location ~* \.(jpg|css|js|woff2)$ { expires 30d; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ =404; }
}
server { listen 80; server_name example.ru; return 301 https://$host$request_uri; }
